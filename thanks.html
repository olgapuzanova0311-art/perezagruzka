*{box-sizing:border-box;margin:0;padding:0}

.btns{display:grid;gap:16px}
.ch{display:flex;align-items:center;gap:16px;border-radius:16px;padding:20px 24px;text-decoration:none;

<script>
(function(){
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycbxsbRPa_v5y4gUsBWQA0qInIZBW5U6zoohu0R7xH5j0J-whPFLgE_zzvsZC7mEX-8u2/exec';
  var chosen = false;

  function sendToSheet(payload){
    if(!SHEET_URL) return;
    var body = JSON.stringify(payload);
    if(navigator.sendBeacon){
      try{
        navigator.sendBeacon(SHEET_URL, new Blob([body], {type:'text/plain;charset=utf-8'}));
        return;
      }catch(e){}
    }
    try{
      fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body, keepalive:true});
    }catch(e){}
  }

  document.getElementById('chTg').addEventListener('click', function(){
    chosen = true;
    sendToSheet({event:'Выбор канала', channel:'Telegram', page: location.href});
  });
  document.getElementById('chMax').addEventListener('click', function(){
    chosen = true;
    sendToSheet({event:'Выбор канала', channel:'MAX', page: location.href});
  });

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden' && !chosen){
      chosen = true; // отправляем только один раз
      sendToSheet({event:'НЕ ДОШЁЛ', channel:'', page: location.href});
    }
  });
  window.addEventListener('pagehide', function(){
    if(!chosen){
      chosen = true;
      sendToSheet({event:'НЕ ДОШЁЛ', channel:'', page: location.href});
    }
  });
})();
</script>
